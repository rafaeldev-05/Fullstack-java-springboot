spring.application.name=FilaSolidaria

# Banco H2 em memoria: os dados existem apenas enquanto a aplicacao estiver rodando.
spring.datasource.url=jdbc:h2:mem:filasolidaria
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Cria/atualiza as tabelas automaticamente a partir das entidades JPA.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
