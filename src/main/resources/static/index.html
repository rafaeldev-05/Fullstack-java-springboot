<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FilaSolidaria</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
    <div>
        <h1>FilaSolidaria</h1>
        <p>Fila virtual para atendimentos por ordem de chegada.</p>
    </div>
    <button id="btnChamarProximo" class="botao destaque" type="button">Chamar proximo</button>
</header>

<main class="conteudo">
    <section class="painel formulario">
        <h2>Entrar na fila</h2>
        <form id="formFila">
            <label for="nome">Nome</label>
            <input id="nome" name="nome" type="text" placeholder="Ex.: Ana Silva" required>

            <label for="telefone">Telefone</label>
            <input id="telefone" name="telefone" type="tel" placeholder="Ex.: (98) 99999-0000" required>

            <label for="tipoAtendimento">Tipo de atendimento</label>
            <select id="tipoAtendimento" name="tipoAtendimento" required>
                <option value="">Selecione</option>
                <option value="Clinica">Clinica</option>
                <option value="Barbearia">Barbearia</option>
                <option value="Assistencia tecnica">Assistencia tecnica</option>
                <option value="Secretaria">Secretaria</option>
            </select>

            <button class="botao" type="submit">Cadastrar</button>
        </form>
        <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </section>

    <section class="painel fila">
        <div class="cabecalho-fila">
            <div>
                <h2>Pessoas na fila</h2>
                <span id="resumoFila">0 pessoas cadastradas</span>
            </div>
            <button id="btnAtualizar" class="botao secundario" type="button">Atualizar</button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                <tr>
                    <th>Posicao</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Atendimento</th>
                    <th>Status</th>
                    <th>Acoes</th>
                </tr>
                </thead>
                <tbody id="corpoTabela">
                <tr>
                    <td colspan="6">Carregando fila...</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
