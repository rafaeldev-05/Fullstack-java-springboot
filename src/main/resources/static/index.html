<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Queue</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topo">
    <div>
        <h1>Service Queue</h1>
        <p>A virtual queue that serves people in order of arrival.</p>
    </div>
    <button id="btnChamarProximo" class="botao destaque" type="button">Call next</button>
</header>

<main class="conteudo">
    <section class="painel formulario">
        <h2>Join the queue</h2>
        <form id="formFila">
            <label for="nome">Name</label>
            <input id="nome" name="nome" type="text" placeholder="e.g. Alex Morgan" required>

            <label for="telefone">Phone</label>
            <input id="telefone" name="telefone" type="tel" placeholder="e.g. (555) 010-1234" required>

            <label for="tipoAtendimento">Service type</label>
            <select id="tipoAtendimento" name="tipoAtendimento" required>
                <option value="">Select a service</option>
                <option value="Clinica">Clinic</option>
                <option value="Barbearia">Barbershop</option>
                <option value="Assistencia tecnica">Technical support</option>
                <option value="Secretaria">Administrative office</option>
            </select>

            <button class="botao" type="submit">Register</button>
        </form>
        <p id="mensagem" class="mensagem" aria-live="polite"></p>
    </section>

    <section class="painel fila">
        <div class="cabecalho-fila">
            <div>
                <h2>People in the queue</h2>
                <span id="resumoFila">0 registered</span>
            </div>
            <button id="btnAtualizar" class="botao secundario" type="button">Refresh</button>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                <tr>
                    <th>Position</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
                </thead>
                <tbody id="corpoTabela">
                <tr>
                    <td colspan="6">Loading queue…</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
